# Wardrobe: what the presenter can be wearing.
#
# This file is the single source of truth for both halves of the feature.
# `tools/generate_wardrobe.py` reads the prompts from here to produce the
# variant portraits, and `presenter/render/wardrobe.py` reads the same entries
# to populate the dropdowns. Keeping the prompt next to the label is what stops
# the generator and the UI drifting apart - previously the prompts lived in the
# tool and nothing tied a generated file to a menu entry.
#
# Each combination is one prepared source portrait, because a garment cannot be
# an overlay in this pipeline: the torso in the output is static pixels from the
# source, and the head is warped from source appearance features. See the
# generator's module docstring.
#
# Filenames are `<clothing>__<headwear>.png` inside `directory`.

base: assets/presenter_source.png
directory: assets/wardrobe

# Shared photographic direction, appended to every prompt. Kept short on
# purpose: CLIP truncates at 77 tokens without warning, and an earlier revision
# lost this entire block off the end of every prompt while appearing to work.
look: >-
  photorealistic raw photo, natural fabric texture, soft warm key light,
  50mm lens, natural cloth folds, high detail

negative: >-
  cartoon, illustration, 3d render, costume, cosplay, plastic,
  distorted fabric, melted cloth, extra arms, hands, fingers,
  text, logo, watermark, low quality, blurry

# Headwear has its own failure modes, and they were found by sweeping variants
# rather than guessed: braided hair and reconstructed headphone cups down the
# sides of the head, and a wound turban instead of a draped cloth. Naming the
# wrong outcomes is the most effective lever available, and `headphones` has to
# be in here because the base portrait has a prominent pair that the model
# otherwise keeps rebuilding inside the mask.
headwear_negative: >-
  turban, wound cloth, bandana, hijab, hat, hood, hair, dreadlocks,
  braids, headphones, headset, cables, tassels, fringe, embroidery

clothing:
  tee:
    label: Grey tee
    prompt: null            # the base portrait, unedited
  # Named for what it renders, not what was asked for. The prompt says white
  # and the result is consistently mid-grey - and it is genuinely grey rather
  # than white under-exposed, because in the very same frames the ghutra comes
  # out bright white against the same key light. Pushing the prompt harder
  # ("bright pure white, brilliant white cotton") made it worse, not whiter:
  # it turned the garment into a grey waistcoat over a beige kurta. The
  # original wording produces a clean thobe with a correct collar and placket,
  # so it stays, and the label matches the picture.
  thobe_grey:
    label: Grey thobe
    prompt: >-
      wearing a crisp white thobe kandura, plain round collar,
      narrow buttoned placket, long sleeves, pressed white cotton
  thobe_beige:
    label: Beige thobe
    prompt: >-
      wearing a light beige thobe kandura, plain round collar,
      long sleeves, soft matte cotton
  polo_navy:
    label: Navy polo
    prompt: >-
      wearing a navy blue cotton polo shirt, ribbed collar,
      short sleeves, soft knit texture
  hoodie_charcoal:
    label: Charcoal hoodie
    prompt: >-
      wearing a charcoal grey hoodie, hood down behind the neck,
      heavy cotton fleece, drawstrings
  shirt_linen:
    label: Linen shirt
    prompt: >-
      wearing an oatmeal linen button-down shirt, open collar,
      rolled sleeves, natural linen slub texture

headwear:
  none:
    label: Bare head
    prompt: null            # keeps the headphones
  # These prompts name the wearer and then *define* the garment. That phrasing
  # was not a stylistic choice - three prompt shapes were generated side by
  # side and only this one produced cloth at all. Naming the item alone
  # ("a white ghutra draped over his head") returns braided hair; establishing
  # "a Saudi man wearing..." and then saying what a ghutra physically is gets
  # the model into the right context first.
  # The agal - the black cord ring - does not come out, and the labels say so.
  # It stays in the prompts because it steers the drape correctly, but it is
  # not rendered: as one clause among many the model spends the whole mask on
  # the cloth, and a dedicated third pass over the crown was tried and was
  # worse, repainting the top of the head as bare scalp. Claiming an agal in
  # the menu that is not in the picture would be the wrong trade.
  ghutra_white:
    label: White ghutra
    drape: 0.9
    prompt: >-
      a Saudi man wearing a white ghutra and black agal, the ghutra is a
      large plain white cotton cloth covering his head and falling over
      both shoulders, the agal is a thick black cord ring on top
  shemagh_red:
    label: Red shemagh
    drape: 0.9
    prompt: >-
      a Saudi man wearing a red and white checkered shemagh and black agal,
      the shemagh is a large checkered cloth covering his head and falling
      over both shoulders, a black cord ring on top
  ghutra_loose:
    label: Ghutra, no agal
    drape: 0.9
    prompt: >-
      a Saudi man wearing a plain white ghutra with no cord, a large white
      cotton cloth covering his head and falling over both shoulders
  taqiyah:
    label: Taqiyah
    drape: 0.0             # a skullcap does not fall past the ears
    prompt: >-
      a white embroidered taqiyah kufi skullcap fitted close to the
      crown of his head, fine tonal embroidery, cotton
