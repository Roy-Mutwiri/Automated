# Camera positions. Seven of them, switched by the buttons in the preview window.
#
# A camera is a whole generated master frame, exactly as an outfit is a whole
# generated portrait. There is no 3D scene here to move a virtual camera
# through: LivePortrait warps a face crop out of one photograph and cannot
# invent the back of a head, a ceiling, or a room it has never seen. So each
# camera is photographed separately and the buttons switch between them.
#
# ## The constraint that shapes the whole list
#
# `tools/evaluate_scenes.py` rejects any master frame whose head yaw exceeds
# 10 degrees, because past that LivePortrait starts hallucinating the parts of
# the head the rotation reveals. That gate decides which cameras can be alive:
#
#   * A camera he is **looking into** has a near-frontal face relative to *that*
#     lens, whatever angle his body is at. It passes the gate and can be
#     animated. This is also what a real multi-camera streamer does - they look
#     at whichever camera is live - so the constraint and the realism point the
#     same way.
#   * A camera showing his **back**, or one far enough away that his face is a
#     handful of pixels, has no drivable face. Those are stills.
#
# `animated: false` is not a limitation being hidden. A locked-off room camera
# in a real multicam show is a static angle you cut to for a few seconds; it is
# the *subject* that moves in it, and there is no subject motion to be had from
# a photograph. Use them as short cuts, not as a resting shot.
#
# ## Room consistency, honestly
#
# Every camera shares the room and negative text from `tools/generate_scene.py`
# verbatim, and only the composition clause changes. That makes them read as
# the same *kind* of room with the same materials, palette and lighting. It does
# not make them geometrically the same room - independent diffusion samples
# cannot be. Making the shelf actually be in the same place across angles needs
# depth reprojection from one master, or a real 3D set. Neither exists yet.

directory: assets/cameras

# Shared across every camera unless one overrides it. Empty means "take the
# generator's default", which is imported from tools/generate_scene.py so the
# room description has exactly one definition.
room: ""

cameras:
  cam1:
    label: "1 · Hero"
    animated: true
    hint: eye level, 50mm, head and shoulders - the default broadcast shot
    subject: >-
      close-up portrait photograph of one adult male streamer seated close to
      camera, his face fills much of the frame, head and shoulders,
      a brown-skinned Arab man in his 30s, short dark beard,
      looking straight into the camera lens, frontal face, calm neutral,
      seated in a black gaming chair, 50mm portrait lens, eye level

  cam2:
    label: "2 · Close"
    animated: true
    hint: tighter than hero; the most animation resolution available
    subject: >-
      tight close-up photograph of one adult male streamer, his head fills the
      frame, a brown-skinned Arab man in his 30s, short dark beard,
      looking straight into the camera lens, frontal face, calm neutral,
      85mm lens, shallow depth of field, eye level

  cam3:
    label: "3 · Left 3/4"
    animated: true
    # He turns to face this lens, so the *body* is three-quarter but the head is
    # frontal to camera and the yaw gate passes. Prompting a profile instead
    # would produce a beautiful frame the renderer cannot animate.
    subject: >-
      photograph of one adult male streamer seated at his desk turned three
      quarters away from the desk, his head turned to look straight into this
      camera, frontal face, a brown-skinned Arab man in his 30s, short dark
      beard, calm neutral, black gaming chair, 50mm lens, eye level

  cam4:
    label: "4 · Right 3/4"
    animated: true
    subject: >-
      photograph of one adult male streamer seated at his desk angled to the
      other side, his head turned to look straight into this camera, frontal
      face, a brown-skinned Arab man in his 30s, short dark beard, calm
      neutral, black gaming chair, 50mm lens, eye level

  cam5:
    label: "5 · High"
    animated: true
    # The design doc rules out high angle for the hero shot and is right to:
    # it foreshortens the face. It is legitimate as a *cut*, and he looks up
    # into the lens so the yaw gate still passes. Pitch is what may fail here,
    # and the gate is allowed to reject it.
    subject: >-
      photograph of one adult male streamer seated at his desk shot from
      slightly above, camera looking down at him, he tilts his head up and
      looks straight into the lens, a brown-skinned Arab man in his 30s, short
      dark beard, calm neutral, black gaming chair, 35mm lens

  cam6:
    label: "6 · Over shoulder"
    animated: false
    hint: behind him, seeing his back, the desk and the monitors - a still
    subject: >-
      photograph taken from behind one adult male streamer, seen over his right
      shoulder from behind, the back of his head and shoulders in the
      foreground, looking past him at his lit desk and two glowing monitors,
      black gaming chair, 35mm lens
    # The shared negative forbids exactly this shot, for the hero camera's sake.
    negative: >-
      side profile, full body, racing simulator, sim rig, empty room,
      no people, rustic, cabin, antique, library, wooden room, brown room,
      music studio, midi keyboard, piano
    negative_2: >-
      racing simulator, empty room, no people, office chair, mesh chair,
      bedroom, rgb lighting, neon, purple, cyberpunk, text, signage, logo,
      watermark, cgi, 3d render, face, frontal face

  cam7:
    label: "7 · Room wide"
    animated: false
    hint: the whole room and setup, he is small in frame - a still
    subject: >-
      wide interior photograph of a modern luxury streaming room at night, the
      whole room and desk setup visible, one adult male streamer small in the
      frame seated at his desk with his back partly to camera, 24mm lens,
      full room visible
    negative: >-
      close-up, portrait, face fills frame, racing simulator, sim rig,
      empty room, no people, rustic, cabin, antique, library, wooden room,
      brown room, music studio, midi keyboard, piano
    negative_2: >-
      close-up, portrait, racing simulator, empty room, no people, office
      chair, mesh chair, bedroom, rgb lighting, neon, purple, cyberpunk, text,
      signage, logo, watermark, cgi, 3d render, deformed hands
