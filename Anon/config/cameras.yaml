# The seven cameras. ONE world, seven projections.
#
# These are physical cameras in the world described by `room_geometry.yaml`,
# not seven images. Each has a position, an aim, a sensor and a lens, and the
# renderer projects the same canonical scene through each of them. Switching
# camera changes nothing except which projection is drawn.
#
# The previous, rejected model - seven separately generated pictures - is kept
# at `config/cameras_2d_legacy.yaml` for reference. It is not loaded.
#
# ## One camera family
#
# Every camera has the same 36 x 24 mm full-frame sensor and the same exposure
# and colour handling, as though the studio bought seven bodies from one family
# and put different lenses on them. Only `focal_length_mm` varies, plus small
# deliberate differences in position. That is what stops a cut reading as a cut
# between two different renderers.
#
# ## Exposure
#
# Deliberately identical and manual across all seven. Auto-exposure would
# "breathe" between cuts, which is one of the loudest ways a multicam show
# announces that it is fake.
#
# ## Aim
#
# Cameras aim at a world-space `look_at` point, not at "the subject". If the
# man moves his head, the camera does not follow - it is bolted to the room, as
# a real one is.

scene_version: SCENE_V1

defaults:
  # 2 cm near clip: the desk front edge is ~14 cm from Camera 1's lens, which
  # is what puts a heavily defocused foreground across the bottom of the plate.
  # Blender's 10 cm default would clip it away.
  clip_start: 0.02
  clip_end: 40.0
  sensor_width_mm: 36.0
  sensor_height_mm: 24.0
  exposure_ev: 0.0
  white_balance_k: 5200
  shutter: 0.5
  resolution: [1920, 1080]

cameras:
  - id: cam1
    name: Hero front
    enabled: true
    position: [0.10, 2.94, 1.26]
    look_at: [0.10, 1.16, 1.22]
    focal_length_mm: 50.0
    f_stop: 2.8
    focus_target: head
    composition: head and shoulders, chair and mic visible
    note: >-
      The reference camera. Matches the approved plate: eye level, subject
      slightly left of centre, display wall behind, desk edge across the
      bottom of frame as the nearest and most defocused object.

  - id: cam2
    name: Left three-quarter
    enabled: true
    # 38 degrees around the head from cam1, camera-left, slightly closer.
    # Raised 20 cm above the boom arm. The mic is physically between the
    # subject and a camera placed at eye level on this side, and a 14 mm tube
    # 15 cm from the lens fills a third of the frame. Clearing it is a camera
    # placement decision, not a reason to move the microphone.
    position: [-1.43, 2.88, 1.49]
    look_at: [0.10, 1.18, 1.22]
    focal_length_mm: 65.0
    f_stop: 2.8
    focus_target: head
    composition: head and upper torso

  - id: cam3
    name: Right three-quarter
    enabled: true
    # 44 degrees the other way and 18 cm further back. Deliberately NOT the
    # mirror of cam2 - the room is not symmetric and neither is he, and a
    # perfectly mirrored pair reads as a trick.
    position: [1.73, 2.80, 1.19]
    look_at: [0.10, 1.18, 1.22]
    focal_length_mm: 65.0
    f_stop: 2.8
    focus_target: head
    composition: head and upper torso

  # ---------------------------------------------------------------------
  # Cameras 4-7 are defined so the rig is complete and the floorplan can be
  # validated, but they are DISABLED until Cameras 1-3 pass the same-man /
  # same-room test. The specification is explicit about that gate and these
  # exist as geometry, not as a promise that they look right yet.
  # ---------------------------------------------------------------------

  - id: cam4
    name: Over shoulder
    enabled: false
    # Behind his shoulder and offset to his right. He faces +Y, so behind him
    # is *low* Y; that part was already right. What was wrong was the aim.
    #
    # The old target [-0.10, 2.30, 1.00] pointed PAST the desk (y=2.00) into
    # the empty front half of the room, so the shot was the back of a head
    # against darkness. The camera was never the problem - it was looking at
    # nothing. This aims at the working surface instead, and the head and
    # shoulder fall into the foreground because the camera is behind them,
    # which is what makes an over-the-shoulder shot rather than a rear shot.
    #
    # Chosen by tools/search_camera_placement.py over 16 candidates. x=+0.44
    # is not the highest-scoring column, but it sits in the gap between
    # monitor_main and monitor_right; the scoring winner floated 0.34 m
    # directly in front of the primary panel, where a real camera body would
    # obstruct the display wall that cameras 1-3 exist to show.
    position: [0.44, 0.44, 1.64]
    look_at: [0.0, 2.0, 0.80]
    focal_length_mm: 40.0
    f_stop: 4.0
    focus_target: monitor_main
    composition: back of head and shoulder foreground, desk surface, mic, room depth
    measured: desk 3/3 landmarks visible, head 27% of frame, 2% of frame black

  - id: cam5
    name: Rear wide
    enabled: false
    # Wall-mounted above the display wall, looking down the room across him.
    # z=1.95 clears the tallest monitor (top edge 1.82), so this is a camera
    # bracketed above the panels rather than one floating in front of them.
    #
    # Same correction as cam4: the old target [0.10, 2.60, 1.00] aimed past
    # the desk into empty floor. This aims at the midpoint of his eye line and
    # the desk - the composition centre of subject-plus-setup, not his origin.
    #
    # Chosen by tools/search_camera_placement.py over 16 candidates.
    position: [-0.25, 0.24, 1.95]
    look_at: [0.05, 1.62, 1.01]
    focal_length_mm: 30.0
    f_stop: 4.0
    focus_target: chair
    note: >-
      Rear means behind *him*. He faces +Y with the slat wall at y=0, so a rear
      camera has only the 1.24 m between his chair and that wall to stand in -
      the tightest constraint in the rig, and the reason this is 30 mm.

      It CANNOT show the monitors. They are mounted on the wall this camera is
      bracketed to, with their normals pointing +Y, away from it. Any camera
      that can see his back has the display wall behind it. "Streamer, desk,
      screens" is therefore not a shot this room contains, and no lens or
      placement changes that - it needs geometry the room does not have. See
      docs/camera_plan_findings.md.
    composition: back of head, chair back, desk surface, mic, room depth
    measured: desk 3/3 landmarks visible, head 9% of frame, 2% of frame black

  - id: cam6
    name: High diagonal
    enabled: false
    position: [1.15, 2.55, 2.35]
    look_at: [0.05, 1.55, 0.80]
    focal_length_mm: 28.0
    f_stop: 4.0
    focus_target: desk
    composition: crown, shoulders, desk surface, keyboard, floor

  - id: cam7
    name: Room wide
    enabled: false
    position: [-1.62, 3.85, 1.55]
    look_at: [0.10, 1.20, 1.15]
    focal_length_mm: 32.0
    f_stop: 5.6
    focus_target: head
    composition: the man and the whole room
