# Camera positions. Seven of them, switched by the buttons in the preview window.
#
# ## The identity problem, and why the rig is shaped like this
#
# The first version generated all seven cameras from text prompts. Every one
# came back a different man - because independent text-to-image samples share a
# *description*, not a person. Cutting between them read as cutting between
# strangers, which destroys the whole premise.
#
# The fix is not a better prompt. It is to notice which frames actually show his
# face:
#
#   * **Cameras that show his face clearly are all the same photograph**,
#     reframed. `derive: true` means the camera does not have an image of its
#     own - it prepares the hero master frame at a different `framing`. Identity
#     is then not "consistent", it is *identical*, because it is one photo. This
#     is also exactly how a single-camera streamer fakes multicam: punch in and
#     out of one clean feed.
#
#   * **Cameras where his face is absent or tiny are generated separately.**
#     Behind him, above him, and the wide room shot have no recognisable face,
#     so a different sample cannot betray a different person. These are the
#     angles that genuinely cannot be faked from the hero frame, and they are
#     the ones worth spending generation on.
#
# What this does not buy: a true three-quarter angle *with his face in it*. That
# needs identity conditioning (IP-Adapter or similar) rather than a prompt, and
# is deliberately not attempted here rather than shipped looking wrong.
#
# ## Live cameras and stills
#
# `tools/evaluate_scenes.py` rejects a master frame past 10 degrees of head yaw,
# because LivePortrait hallucinates beyond it. Derived cameras inherit the hero
# frame's yaw, so if the hero passes they all pass. Generated angles have no
# drivable face at all and are stills: the application never calls the renderer
# for them, which is why those cuts are instant and cost no VRAM.
#
# A still is a shot you cut *to* for a few seconds. There is no subject motion
# available from a photograph, and pretending otherwise would be worse.

directory: assets/cameras

# The photograph the derived cameras reframe. Everything about the man - who he
# is, what he is wearing, the room he is in - is decided here, once.
master: assets/cameras/cam1.png

room: ""

cameras:
  cam1:
    label: "1 Hero"
    animated: true
    derive: true
    framing: full
    hint: the master frame, full bleed

  cam2:
    label: "2 Medium"
    animated: true
    derive: true
    framing: shoulders
    hint: head and shoulders, punched in from the master - the same photograph

  cam3:
    label: "3 Close"
    animated: true
    derive: true
    framing: close
    hint: tight on the face; the most animation resolution available

  cam4:
    label: "4 Over shoulder"
    animated: false
    hint: behind him, seeing his back, the desk and the monitors - a still
    subject: >-
      photograph taken from behind one adult male streamer, seen over his right
      shoulder from behind, the back of his head and shoulders in the
      foreground, looking past him at his lit desk and two glowing monitors,
      black gaming chair, 35mm lens
    # The shared negative forbids exactly this shot, for the hero camera's sake.
    negative: >-
      side profile, full body, racing simulator, sim rig, empty room,
      no people, rustic, cabin, antique, library, wooden room, brown room,
      music studio, midi keyboard, piano
    negative_2: >-
      racing simulator, empty room, no people, office chair, mesh chair,
      bedroom, rgb lighting, neon, purple, cyberpunk, text, signage, logo,
      watermark, cgi, 3d render, face, frontal face

  # "Top down view" alone returned frontal shots and, worse, line drawings -
  # the shared negative excludes "cgi, 3d render" but never excluded
  # *illustration*, so several candidates came back as sketches. Both are fixed
  # here: the camera position is stated as a physical fact ("camera mounted on
  # the ceiling"), and drawing terms are banned outright.
  cam5:
    label: "5 Overhead"
    animated: false
    hint: looking down on him from above the desk - a still
    subject: >-
      photograph from a camera mounted on the ceiling directly above a desk,
      looking straight down, bird eye view from above of one adult male
      streamer sitting at his desk, only the top of his head visible,
      keyboard and desk surface seen from above
    negative: >-
      sketch, line art, drawing, illustration, monochrome, black and white,
      frontal face, portrait, eye level, low angle, empty room, no people,
      rustic, cabin, antique, library, wooden room, brown room
    negative_2: >-
      sketch, line art, drawing, illustration, monochrome, frontal face,
      eye level, empty room, no people, bedroom, rgb lighting, neon, purple,
      cyberpunk, text, signage, logo, watermark, cgi, 3d render, deformed hands

  cam6:
    label: "6 Room wide"
    animated: false
    hint: the whole room and setup, he is small in frame - a still
    subject: >-
      wide interior photograph of a modern luxury streaming room at night, the
      whole room and desk setup visible, one adult male streamer small in the
      frame seated at his desk with his back partly to camera, 24mm lens,
      full room visible
    negative: >-
      close-up, portrait, face fills frame, racing simulator, sim rig,
      empty room, no people, rustic, cabin, antique, library, wooden room,
      brown room, music studio, midi keyboard, piano
    negative_2: >-
      close-up, portrait, racing simulator, empty room, no people, office
      chair, mesh chair, bedroom, rgb lighting, neon, purple, cyberpunk, text,
      signage, logo, watermark, cgi, 3d render, deformed hands

  cam7:
    label: "7 Desk"
    animated: false
    hint: the gear on the desk, no person - a cutaway
    subject: >-
      close photograph of a streaming desk surface, broadcast microphone on a
      boom arm, mechanical keyboard, headphone stand, matte black desk,
      shallow depth of field, 50mm lens, no person
    negative: >-
      person, man, face, portrait, hands, racing simulator, sim rig, rustic,
      cabin, antique, library, wooden room, brown room, music studio,
      midi keyboard, piano
    negative_2: >-
      person, man, face, hands, racing simulator, office chair, mesh chair,
      bedroom, rgb lighting, neon, purple, cyberpunk, text, signage, logo,
      watermark, cgi, 3d render
