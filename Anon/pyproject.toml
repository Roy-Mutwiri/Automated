[project]
name = "ai-presenter"
version = "0.1.0"
description = "Real-time photoreal AI human presenter - autonomous idle behaviour and rendering"
requires-python = ">=3.11"

# Deliberately minimal. torch/torchvision are installed separately against the
# CUDA 12.8 index because this machine is Blackwell (sm_120) and the default
# PyPI wheels do not carry sm_120 kernels - see README for the exact command.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
presenter = "presenter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presenter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
