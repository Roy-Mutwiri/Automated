[project]
name = "gold-live"
version = "0.5.0"
description = "24/7 multi-session AI broadcasting system for XAUUSD commentary"
requires-python = ">=3.12"
# The set the runtime actually imports. Six of these were previously
# undeclared and reached the packaged build only if they happened to be in the
# build machine's virtualenv; websockets and piper-tts are load-bearing --
# without them there is no live price and no speech.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "piper-tts>=1.2",
    "onnxruntime>=1.17",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "mss>=9.0",
]

[project.optional-dependencies]
# fakeredis is a TEST dependency, not an optional extra: tests/test_event_bus.py
# importorskips it, so without it that file skips silently and the event bus
# looks tested when it is not. CI installed it separately, which meant
# `pip install -e ".[dev]"` did not give a developer the same suite CI runs.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyinstaller>=6.0",
    "fakeredis>=2.21",
]
# Comparison against a hosted model. Never used in production.
hosted = ["anthropic>=0.40"]
# Screen-capture comment ingestion. Large ML stack; opt in deliberately.
ocr = ["paddleocr>=2.7"]

[project.scripts]
gold-dryrun = "runtime.dryrun:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# dashboard and scripts were omitted, but runtime/cli.py imports
# scripts.bench_llm, scripts.calibrate_capture and dashboard.server -- a plain
# `pip install .` produced a CLI whose dashboard/bench/calibrate subcommands
# raised ModuleNotFoundError.
packages = ["shared", "intelligence", "platform_", "runtime", "dashboard", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repository root, so `intelligence`, `platform_`, `runtime` and `shared`
# import without the caller having to arrange it.
#
# `python -m pytest` happens to work without this because Python puts the
# working directory on sys.path; the `pytest` console script does not, so the
# command the README documented failed from a fresh clone with
# ModuleNotFoundError. This makes both spellings behave the same. It is one
# ini setting rather than a src/ layout migration -- the packages are already
# declared under [tool.setuptools] and restructuring them is not worth it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rules that catch real defects. Style-only rules are deliberately off -- a
# lint config that argues about datetime.UTC versus timezone.utc trains people
# to run `--fix` without reading, which is how a real finding gets skipped.
select = ["E", "F", "W", "B", "A", "C4", "PIE", "RUF"]
ignore = [
    "E501",    # line length: the formatter's job, not a review comment
    "B008",    # function call in default arg: intentional for path defaults
    "RUF012",  # mutable class attrs: used deliberately for shared registries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "A002"]
